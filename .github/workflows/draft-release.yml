name: Build and draft release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version phải khớp Directory.Build.props
        required: true
        default: 3.3.0
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-python
            unzip
      - name: Build and run regression suite
        shell: msys2 {0}
        run: bash tests/run_tests.sh
      - name: Package, smoke test, and create draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/package-release.ps1 -Version '${{ inputs.version }}' -SkipTests -CreateDraft -OutputDirectory '${{ runner.temp }}\OjGen-release'
